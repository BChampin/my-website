packages:
  - apps/*
  - packages/*

catalogMode: prefer

catalog:
  "@types/node": ^24
  typescript: ^5
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vite-plus: latest
  vue: ^3.5.13
  vue-router: ^4.5.0
  pinia: ^3.0.3
  tailwindcss: ^4.0.3
  "@tailwindcss/vite": ^4.0.3

overrides:
  vite: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
